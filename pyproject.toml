[project]
name = "online-complaint-classifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
